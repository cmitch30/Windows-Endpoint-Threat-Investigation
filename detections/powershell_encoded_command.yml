
title: Suspicious PowerShell Encoded Command Execution
id: 9d3f6c2e-4a71-4d9b-8c15-2f0a7b6e9d42
status: experimental
description: >
  Detects PowerShell process creation events containing
  encoded-command arguments. Such arguments may be used
  for legitimate administration or to obscure script content.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: Clark Mitchell
date: 2026-11-18
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_commandline:
    CommandLine|contains:
      - '-EncodedCommand'
      - '-enc '
  condition: selection_image and selection_commandline
falsepositives:
  - Legitimate administrative scripts using encoded PowerShell commands
  - Software deployment and endpoint management tools
level: high
